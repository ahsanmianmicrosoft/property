version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: primehaven-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-primehaven_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-primehaven_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-primehaven_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-primehaven_user} -d ${POSTGRES_DB:-primehaven_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: primehaven-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: primehaven-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-primehaven_user}:${POSTGRES_PASSWORD:-primehaven_secret_2026}@postgres:5432/${POSTGRES_DB:-primehaven_db}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-enterprise_jwt_secret_primehaven_key_2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
